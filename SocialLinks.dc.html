</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light' | 'dark'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.tone === 'dark';
    const color = dark ? 'rgba(255,255,255,0.7)' : 'var(--text-muted)';
    const border = dark ? 'rgba(255,255,255,0.26)' : 'var(--line-strong)';
    const hoverColor = dark ? '#ffffff' : 'var(--accent-strong)';
    return {
      linkStyle: {
        width: '40px', height: '40px', borderRadius: '999px',
        border: '1px solid ' + border, display: 'inline-flex',
        alignItems: 'center', justifyContent: 'center',
        color: color, textDecoration: 'none', flex: 'none',
        transition: 'color var(--dur-base), border-color var(--dur-base)',
      },
      hoverStyle: { color: hoverColor, borderColor: hoverColor },
    };
  }
}
</script>
</body>
</html>
