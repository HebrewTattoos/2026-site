<!-- Warms the DNS+TLS connection for Google Fonts ahead of the actual
     <link rel="stylesheet"> requests further down (duplicated into the

<!-- Self-hosted so booting the app doesn't depend on a third-party CDN
     round-trip before anything can paint — Search Console flagged every
     page's mobile LCP as "needs improvement" (>2.5s), and support.js's own
     loadReactUmd() fetched these two files from unpkg.com on every fresh
     load with nothing rendering until that finished. cdnScriptFor() (in
     support.js) already checks window.__resources for a substitute URL
     before falling back to the CDN one, so this doesn't require patching
     the compiled runtime itself — just needs to run before support.js's own
     script executes. Files are byte-identical to the pinned SRI hashes
     support.js already carries for the CDN originals (react@18.3.1/
     react-dom@18.3.1 production UMD) — verified via sha384 before adding. -->
<link rel="preload" href="/vendor/react.production.min.js" as="script">
<link rel="preload" href="/vendor/react-dom.production.min.js" as="script">
<script>
  window.__resources = {
    "https://unpkg.com/react@18.3.1/umd/react.production.min.js": "/vendor/react.production.min.js",
    "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js": "/vendor/react-dom.production.min.js"
  };
</script>
<script src="/support.js"></script>
<!-- Duplicated from the helmet block below: now that the raw app template
     is wrapped as inert content (see the inert-template patch), these no
     longer get the browser's early parser-driven load pass on their own.
     Keeping a copy here preserves that early-start timing; requests dedupe
     from cache. Deliberately avoids writing the literal template tag names
     in this comment -- parseDcText finds template boundaries by searching
     the raw page text for those exact substrings, and a prose mention here
     would be matched ahead of the real tag and corrupt the self-refetch. -->
<link rel="stylesheet" href="/ds/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<script src="/image-slot.js"></script>
</head>
<body>
<template id="dc-source">
<x-dc>
<helmet>
<link rel="stylesheet" href="/ds/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap">
<script src="/image-slot.js"></script>
<style>
  :root { --color-bg: #fff; --color-surface: #fff; --color-surface-alt: #fff; --color-surface-raised: #fff; --radius-none: 0; --radius-sm: 0; --radius-md: 0; --radius-lg: 0; --radius-pill: 0; }
  html, body { margin: 0; background: var(--color-bg); overflow-x: hidden; }
  * { box-sizing: border-box; }
  ::selection { background: var(--accent-soft); }
  @keyframes ht-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .ht-marquee-track { display: flex; align-items: center; gap: clamp(48px,6vw,88px); width: max-content; animation: ht-marquee 32s linear infinite; }
  .ht-marquee-mask { width: 100%; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
  .ht-marquee-track a { display: block; flex: none; }
  .ht-marquee-track img, .ht-marquee-track span { opacity: 1; filter: grayscale(1); }
  .ht-tl-row { opacity: 0; transform: translateY(22px); transition: opacity 1.8s cubic-bezier(.22,1,.36,1), transform 1.8s cubic-bezier(.22,1,.36,1); }
  .ht-tl-row.is-in { opacity: 1; transform: none; }
  .lx-r { opacity: 0; transform: translateY(26px); transition: opacity 1.1s cubic-bezier(.16,1,.3,1), transform 1.1s cubic-bezier(.16,1,.3,1); }
  .lx-r.lx-in { opacity: 1; transform: none; }
  .ht-journey-fade { opacity: 0; }
  @keyframes ht-fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes ht-spine-pulse { 0%,100% { opacity: .35; transform: translate(-50%,0) scale(1); } 50% { opacity: 1; transform: translate(-50%,0) scale(1.35); } }
  .ht-spine-tip { animation: ht-spine-pulse 2.6s ease-in-out infinite; }
  /* ---- Mobile responsive ---- */
  .ht-burger { display: none; align-items: center; justify-content: center; }
    .ht-testi-4th { display: none !important; }
  @media (max-width: 920px) {
    .ht-desktop-nav { display: none !important; }
    .ht-burger { display: inline-flex !important; }
  }
  @media (max-width: 760px) {
    [style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
    .ht-mat-legend { display: none !important; }
    .ht-tattooist-sticky, .ht-member-sticky { position: static !important; top: auto !important; }
    .ht-process-photo { height: auto !important; aspect-ratio: 4/3 !important; }
    .ht-tattooist-examples { grid-template-columns: repeat(2,1fr) !important; }
    .ht-works-grid { grid-template-columns: repeat(2,1fr) !important; gap: 52px 28px !important; }
    .ht-faq-body { flex-direction: column !important; }
    .ht-piece-gallery { display: grid !important; grid-template-columns: repeat(2,1fr) !important; gap: 16px !important; }
    .ht-about-snippet { grid-template-columns: 1fr !important; align-items: start !important; gap: 32px !important; }
    .ht-about-img { order: 1 !important; }
    .ht-about-img > div { aspect-ratio: 4/3 !important; }
    .ht-about-text { order: 2 !important; max-width: none !important; gap: 22px !important; }
    .ht-about-text > p:first-child { font-size: 30px !important; line-height: 1.24 !important; }
    .ht-about-text > p + p { font-size: 17px !important; line-height: 1.65 !important; }
    .ht-press-grid { grid-template-columns: repeat(2,1fr) !important; }
    .ht-library-grid { grid-template-columns: repeat(2,1fr) !important; }
    .ht-testi-grid { grid-template-columns: repeat(2,1fr) !important; }
    .ht-testi-4th { display: flex !important; }
    #ht-header-logo img { height: 32px !important; }
    #ht-header { padding: 14px clamp(1.2rem,5vw,2rem) !important; }
    #ht-stats-figures { grid-template-columns: repeat(3,1fr) !important; gap: 12px !important; }
    #ht-stats-figures > div { padding: 0 8px !important; }
  }
  @media (max-width: 480px) {
    .ht-works-grid { grid-template-columns: repeat(2,1fr) !important; gap: 28px 14px !important; }
    .ht-tattooist-examples { grid-template-columns: repeat(2,1fr) !important; }
  }
  .ht-piece-gallery > figure:only-child { grid-column: 1 / -1; }
  @media (max-width: 760px) {
    .ht-journey-row { gap: 10px !important; padding-bottom: 28px !important; grid-template-columns: 1fr 1fr !important; }
    .ht-journey-image > div > div { aspect-ratio: 4/5 !important; }
    .ht-journey-text { min-width: 0 !important; }
    .ht-journey-text > span { font-size: 44px !important; }
    .ht-journey-text h3 { font-size: 24px !important; max-width: none !important; }
    .ht-journey-text p { font-size: 16px !important; max-width: none !important; }
    .ht-journey-image { min-width: 0 !important; }
    /* Desktop pulls each row's image up (imgOverlapTop, inline style) to stagger
       it against the row above — safe there because the wider desktop type
       scale gives each row enough height to absorb it. The mobile font-size
       overrides above shrink that height, so the same fixed pull-up now
       reaches into the previous row's column and overlaps its text. Cancel it
       on mobile; the stagger is a desktop-only flourish, not load-bearing. */
    .ht-journey-image > div { width: 100% !important; margin-left: 0 !important; margin-right: 0 !important; margin-top: 0 !important; }
    .ht-journey-layout { grid-template-columns: 1fr !important; }
    .ht-journey-heading { position: static !important; margin-bottom: 32px !important; }
  }
</style>
</helmet>
<sc-if value="{{ showCookieBanner }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Cookie banner" style="position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--ink-900);color:var(--paper-200);padding:18px clamp(1.25rem,4vw,3rem);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;font-family:var(--font-sans);">
    <p style="margin:0;font-size:13px;line-height:1.6;max-width:64ch;color:var(--paper-200);">We use cookies to understand how visitors use this site and improve it. See our <a href="/privacy" style="color:var(--paper-200);text-decoration:underline;">privacy policy</a>.</p>
    <div style="display:flex;gap:10px;flex:none;">
      <button onClick="{{ declineCookies }}" style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:11px 20px;background:transparent;color:var(--paper-200);border:1px solid var(--paper-200);border-radius:var(--radius-sm);cursor:pointer;">Decline</button>
      <button onClick="{{ acceptCookies }}" style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:11px 20px;background:var(--paper-200);color:var(--ink-900);border:none;border-radius:var(--radius-sm);cursor:pointer;">Accept</button>
    </div>
  </div>
</sc-if>
<div style="font-family:var(--font-serif);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;background:var(--color-bg);">


  <!-- Utility bar -->
  <div style="background:var(--paper-100);border-bottom:1px solid var(--line);text-align:center;padding:9px 1rem;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);">Drawn in Berlin · Tattooed worldwide</div>

  <!-- Header -->
  <header id="ht-header" data-screen-label="Header" style="position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(1.5rem,5vw,5rem);background:rgba(239,241,247,0.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);">
    <button id="ht-header-logo" onClick="{{ goHome }}" style="display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;text-align:left;padding:0;will-change:transform;">
      <img src="/uploads/AlephIcon_Color-dc721b25.png" alt="Hebrew Tattoos" width="40" height="40" style="height:40px;width:auto;display:block;">
      <span id="ht-header-logo-text" style="font-family:var(--font-sans);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#2338c9;white-space:nowrap;transition:opacity .2s linear;">Hebrew Tattoos</span>
    </button>
    <nav class="ht-desktop-nav" style="display:flex;align-items:center;gap:clamp(14px,1.4vw,24px);flex-wrap:wrap;justify-content:flex-end;">
      <div style="position:relative;">
        <button onClick="{{ goWork }}" style="{{ navWork }}">The Work</button>
      </div>
      <div style="position:relative;">
        <button onClick="{{ toggleStudio }}" style="{{ navStudio }}">The Studio <span style="display:inline-block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:9px;"></span></button>
        <sc-if value="{{ studioOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:calc(100% + 16px);right:0;z-index:40;min-width:268px;background:var(--color-surface-raised);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 24px 60px -28px rgba(8,8,46,.4);padding:9px;display:flex;flex-direction:column;gap:1px;">
            <button onClick="{{ goAbout }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">About</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">The studio &amp; its philosophy</span>
            </button>
            <button onClick="{{ goTeam }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">The Team</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">Berlin &amp; New York</span>
            </button>
            <button onClick="{{ goTattooists }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">Tattooists</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">Working with us, globally</span>
            </button>
            <button onClick="{{ goMaaser }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 16px;border-radius:var(--radius-sm);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">Ma’aser</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">Why we give</span>
            </button>
            <button onClick="{{ goTestimonies }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">Testimonies</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">From around the world</span>
            </button>
            <button onClick="{{ goPress }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">Press</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">International coverage</span>
            </button>
          </div>
        </sc-if>
      </div>
      <div style="position:relative;">
        <button onClick="{{ toggleCraft }}" style="{{ navCraft }}">The Craft <span style="display:inline-block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:9px;"></span></button>
        <sc-if value="{{ craftOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:calc(100% + 16px);right:0;z-index:40;min-width:210px;background:var(--color-surface-raised);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 24px 60px -28px rgba(8,8,46,.4);padding:10px;display:flex;flex-direction:column;gap:2px;">
            <button onClick="{{ goGuides }}" style="{{ menuItem }}" style-hover="background:var(--color-surface-alt);">The process</button>
            <button onClick="{{ goPlacement }}" style="{{ menuItem }}" style-hover="background:var(--color-surface-alt);">Placement</button>
            <button onClick="{{ goMaterials }}" style="{{ menuItem }}" style-hover="background:var(--color-surface-alt);">Materials</button>
            <button onClick="{{ goFaq }}" style="{{ menuItem }}" style-hover="background:var(--color-surface-alt);">FAQ</button>
          </div>
        </sc-if>
      </div>
      <div style="position:relative;">
        <button onClick="{{ toggleLibrary }}" style="{{ navBlog }}">Library <span style="display:inline-block;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:9px;"></span></button>
        <sc-if value="{{ libraryOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:calc(100% + 16px);right:0;z-index:40;min-width:288px;background:var(--color-surface-raised);border:1px solid var(--line);border-radius:var(--radius-sm);box-shadow:0 24px 60px -28px rgba(8,8,46,.4);padding:9px;display:flex;flex-direction:column;gap:1px;">
            <button onClick="{{ goBlog }}" style="display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
              <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">All writing</span>
              <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">The complete library</span>
            </button>
            <sc-for list="{{ libraryCats }}" as="c" hint-placeholder-count="5">
              <div style="display:flex;flex-direction:column;">
                <button onClick="{{ c.toggle }}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:11px 14px;border-radius:var(--radius-sm);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">
                  <span style="display:flex;flex-direction:column;gap:2px;">
                    <span style="font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:.01em;color:var(--ink-900);">{{ c.label }}</span>
                    <span style="font-family:var(--font-serif);font-style:italic;font-size:12.5px;color:var(--text-muted);">{{ c.tagline }}</span>
                  </span>
                  <span style="font-family:var(--font-sans);font-size:15px;font-weight:400;color:var(--text-muted);line-height:1;width:14px;text-align:center;flex:none;">{{ c.chev }}</span>
                </button>
                <sc-if value="{{ c.expanded }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;flex-direction:column;gap:1px;padding:2px 0 8px 14px;margin:0 6px 4px;border-left:1px solid var(--line);">
                    <button onClick="{{ c.goTo }}" style="text-align:left;background:none;border:none;cursor:pointer;padding:7px 12px;border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);transition:color var(--dur-base);" style-hover="color:var(--blue-900);">All {{ c.label }} →</button>
                    <sc-for list="{{ c.items }}" as="a" hint-placeholder-count="3">
                      <button onClick="{{ a.open }}" style="text-align:left;background:none;border:none;cursor:pointer;padding:8px 12px;border-radius:var(--radius-sm);font-family:var(--font-serif);font-size:14px;color:var(--ink-900);transition:background var(--dur-base);" style-hover="background:var(--color-surface-alt);">{{ a.title }}</button>
                    </sc-for>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <button onClick="{{ goShop }}" style="{{ navShop }}">Shop</button>
      <button onClick="{{ goInnerCircle }}" style="{{ navInnerCircle }}">Inner Circle</button>
      <button onClick="{{ goContact }}" style="{{ navContact }}">Contact</button>

  <!-- ============ GUIDES & GUIDELINES (the process) ============ -->
  <sc-if value="{{ isGuides }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Guides" style="padding:clamp(48px,7vw,88px) clamp(1.5rem,5vw,5rem) clamp(72px,9vw,112px);">
    <div style="max-width:1040px;margin:0 auto;">

      <!-- Title -->
      <div style="max-width:64ch;">
        <div style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);">Guides &amp; Guidelines</div>
        <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(38px,5vw,64px);line-height:1.04;color:var(--ink-900);margin:14px 0 24px;letter-spacing:-.015em;">How a commission unfolds</h1>
        <p style="font-family:var(--font-serif);font-style:italic;font-size:19px;line-height:1.65;color:var(--text-secondary);margin:0;">Every piece begins with a conversation and ends with letters that will be carried for a lifetime. Here is the path between the two, slow, deliberate, and drawn entirely by hand.</p>
      </div>

      <div style="margin:clamp(40px,5vw,60px) 0 0;"></div>

      <!-- Detailed phases, the line unfolds on the left as you scroll -->
      <div id="ht-process-spine" style="position:relative;padding-left:clamp(64px,13vw,108px);">
        <!-- spine track -->
        <div style="position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line);-webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 72%, transparent 97%);mask-image:linear-gradient(to bottom, #000 0%, #000 72%, transparent 97%);"></div>
        <!-- spine fill (scroll-driven), masked so it fades out toward the end of the process -->
        <div style="position:absolute;left:5px;top:0;bottom:0;width:2px;-webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 72%, transparent 97%);mask-image:linear-gradient(to bottom, #000 0%, #000 72%, transparent 97%);">
          <div style="position:absolute;left:0;top:0;width:2px;height:{{ scrollFillH }};background:linear-gradient(to bottom, var(--accent-soft) 0%, var(--accent) 14%, var(--accent) 100%);transition:height .12s linear;">
            <div class="ht-spine-tip" style="position:absolute;left:50%;bottom:0;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);"></div>
          </div>
        </div>
        <!-- elapsed-time label riding the tip -->
        <div style="position:absolute;left:0;width:calc(clamp(64px,13vw,108px) - 20px);text-align:right;top:{{ scrollFillH }};opacity:{{ tipOpacity }};transform:translateY(-50%);transition:top .12s linear, opacity .2s linear;pointer-events:none;z-index:2;font-family:'Frank Ruhl Libre',var(--font-serif);font-style:italic;font-size:15px;font-weight:500;letter-spacing:.005em;line-height:1;color:var(--accent-strong);white-space:nowrap;">{{ tipLabel }}</div>
        <div style="border-top:1px solid var(--line-strong);">
        <sc-for list="{{ phaseSteps }}" as="s" hint-placeholder-count="6">
          <div style="position:relative;display:grid;grid-template-columns:clamp(64px,8vw,116px) 1fr;gap:clamp(20px,3.5vw,52px);padding:clamp(34px,4.5vw,60px) 0;border-bottom:1px solid var(--line);">
            <div class="ht-spine-dot" style="position:absolute;left:calc(-1 * clamp(64px,13vw,108px) + 6px);top:clamp(46px,5.5vw,72px);width:13px;height:13px;border-radius:50%;background:var(--color-bg);border:2px solid {{ s.dotColor }};transform:translate(-50%,-50%);transition:border-color .45s ease;"></div>
            <div style="display:flex;flex-direction:column;align-items:flex-start;">
              <span style="font-family:var(--font-display);font-weight:300;font-style:italic;font-size:clamp(40px,5.5vw,76px);line-height:.78;letter-spacing:-.02em;color:{{ s.numColor }};transition:color .45s ease;">{{ s.n }}</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr clamp(190px,24vw,300px);gap:clamp(22px,3.5vw,52px);align-items:stretch;">
            <div>
              <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:clamp(14px,1.6vw,20px);">
                <h2 style="font-family:var(--font-display);font-weight:400;font-size:clamp(24px,2.6vw,36px);line-height:1;color:var(--ink-900);margin:0;letter-spacing:-.01em;">{{ s.title }}</h2>
                <span style="font-family:var(--font-serif);font-style:italic;font-size:16px;color:var(--accent-strong);">{{ s.who }}</span>
              </div>
              <sc-for list="{{ s.paras }}" as="para" hint-placeholder-count="2">
                <p style="font-family:var(--font-serif);font-size:17.5px;line-height:1.72;color:var(--text-secondary);margin:0 0 14px;max-width:60ch;">{{ para }}</p>
              </sc-for>
              <sc-if value="{{ s.hasLink }}" hint-placeholder-val="{{ false }}">
                <button onClick="{{ s.linkAction }}" style="align-self:flex-start;margin:2px 0 4px;background:#fff;border:1px solid #000;border-radius:0;padding:14px 30px;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#000;transition:opacity var(--dur-base);" style-hover="opacity:0.6;">{{ s.linkLabel }} →</button>
              </sc-if>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2.4vw,40px);margin-top:clamp(20px,2.4vw,30px);border-top:1px solid var(--line);padding-top:clamp(16px,1.8vw,22px);">
                <div style="display:flex;flex-direction:column;gap:6px;">
                  <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);">What we need</span>
                  <span style="font-family:var(--font-serif);font-size:15.5px;line-height:1.5;color:var(--text-primary);">{{ s.need }}</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                  <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);">Typical timeframe</span>
                  <span style="font-family:var(--font-serif);font-size:15.5px;line-height:1.5;color:var(--text-primary);">{{ s.timeframe }}</span>
                </div>
              </div>
            </div>
            <div class="ht-process-photo" style="display:block;width:100%;aspect-ratio:4/5;">
              <image-slot id="{{ s.slotId }}" src="{{ s.img }}" shape="rect" placeholder="Add image" style="display:block;width:100%;height:100%;background:var(--paper-300);box-shadow:0 18px 40px -28px rgba(8,8,46,.4);"></image-slot>
            </div>
            </div>
          </div>
        </sc-for>
        </div>
      </div>

      <!-- Principles -->
      <div style="margin-top:clamp(56px,7vw,88px);">
        <h2 style="font-family:var(--font-display);font-weight:300;font-size:clamp(26px,3vw,40px);color:var(--ink-900);margin:0 0 clamp(28px,3vw,40px);letter-spacing:-.01em;">How we work</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:clamp(20px,2.4vw,32px);">
          <sc-for list="{{ processPrinciples }}" as="p" hint-placeholder-count="4">
            <div style="border-top:2px solid var(--ink-900);padding-top:18px;">
              <h3 style="font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--ink-900);margin:0 0 8px;">{{ p.t }}</h3>
              <p style="font-family:var(--font-serif);font-size:15.5px;line-height:1.6;color:var(--text-secondary);margin:0;">{{ p.d }}</p>
            </div>
          </sc-for>
        </div>
      </div>

      <!-- Related guides + CTA -->
      <div style="margin-top:clamp(56px,7vw,88px);">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(32px,4vw,48px);">
          <div style="max-width:42ch;">
            <h2 style="font-family:var(--font-display);font-weight:300;font-size:clamp(26px,3vw,38px);line-height:1.08;margin:0 0 12px;letter-spacing:-.01em;color:var(--ink-900);">Read on, or begin.</h2>
            <p style="font-family:var(--font-serif);font-size:17px;line-height:1.65;color:var(--text-secondary);margin:0;">Deeper guidance on the parts that matter most, and an open door when you’re ready to talk.</p>
          </div>
          <button onClick="{{ goContact }}" style="flex:none;background:#fff;border:1px solid #000;border-radius:0;padding:14px 30px;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#000;transition:opacity var(--dur-base);" style-hover="opacity:0.6;">Start a conversation</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:32px 24px;">
          <div onClick="{{ goPlacement }}" style="display:flex;flex-direction:column;cursor:pointer;">
            <div style="aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);margin-bottom:22px;">
              <image-slot id="read-placement" shape="rect" src="/assets/timeline/tl-tattooed.jpg" placeholder="Add image" style="display:block;width:100%;height:100%;"></image-slot>
            </div>
            <h3 style="font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--ink-900);margin:0 0 6px;">Placement →</h3>
            <p style="font-family:var(--font-serif);font-style:italic;font-size:14.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 14px;">Where on the body a word belongs.</p>
            <div style="border-top:1px solid var(--line);"></div>
          </div>
          <div onClick="{{ goMaterials }}" style="display:flex;flex-direction:column;cursor:pointer;">
            <div style="aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);margin-bottom:22px;">
              <image-slot id="read-materials" shape="rect" src="/assets/materials/mat-nibs.jpg" placeholder="Add image" style="display:block;width:100%;height:100%;"></image-slot>
            </div>
            <h3 style="font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--ink-900);margin:0 0 6px;">Materials →</h3>
            <p style="font-family:var(--font-serif);font-style:italic;font-size:14.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 14px;">What we use, and why it lasts.</p>
            <div style="border-top:1px solid var(--line);"></div>
          </div>
          <div onClick="{{ goStudioVisit }}" style="display:flex;flex-direction:column;cursor:pointer;">
            <div style="aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);margin-bottom:22px;">
              <image-slot id="read-studiovisit" shape="rect" src="/assets/studiovisit-table.jpg" placeholder="Add image" style="display:block;width:100%;height:100%;"></image-slot>
            </div>
            <h3 style="font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--ink-900);margin:0 0 6px;">A studio visit →</h3>
            <p style="font-family:var(--font-serif);font-style:italic;font-size:14.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 14px;">Coming to Berlin for your piece.</p>
            <div style="border-top:1px solid var(--line);"></div>
          </div>
          <div onClick="{{ goCare }}" style="display:flex;flex-direction:column;cursor:pointer;">
            <div style="aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);margin-bottom:22px;">
              <image-slot id="read-care" shape="rect" src="/assets/donna-kaufman-tattoo.jpg" placeholder="Add image" style="display:block;width:100%;height:100%;"></image-slot>
            </div>
            <h3 style="font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--ink-900);margin:0 0 6px;">Tattoo &amp; aftercare →</h3>
            <p style="font-family:var(--font-serif);font-style:italic;font-size:14.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 14px;">Caring for the piece as it heals.</p>
            <div style="border-top:1px solid var(--line);"></div>
          </div>
          <div onClick="{{ goFaq }}" style="display:flex;flex-direction:column;cursor:pointer;">
            <div style="aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);margin-bottom:22px;">
              <image-slot id="read-faq" shape="rect" src="/ds/ruling-pens.jpg" placeholder="Add image" style="display:block;width:100%;height:100%;"></image-slot>
            </div>
            <h3 style="font-family:var(--font-display);font-weight:500;font-size:19px;color:var(--ink-900);margin:0 0 6px;">Questions, answered →</h3>
            <p style="font-family:var(--font-serif);font-style:italic;font-size:14.5px;line-height:1.5;color:var(--text-secondary);margin:0 0 14px;">Everything else, in one place.</p>
            <div style="border-top:1px solid var(--line);"></div>
          </div>
        </div>
      </div>

    </div>
  </div>
  </sc-if>

  <!-- ============ LIBRARY ============ -->
  <sc-if value="{{ isBlog }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Library" style="padding:clamp(48px,7vw,88px) clamp(1.5rem,5vw,5rem) clamp(72px,9vw,112px);">
    <div style="max-width:var(--container-max);margin:0 auto;">
      <div style="display:flex;flex-direction:column;gap:16px;max-width:54ch;margin-bottom:clamp(44px,5vw,68px);">
        <div style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);">The Library</div>
        <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(38px,5vw,64px);line-height:1.05;color:var(--ink-900);margin:0;letter-spacing:-.015em;">Our thoughts</h1>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.65;color:var(--text-secondary);margin:0;">We are artists. Writing is part of what we do. <br>Here are our thoughts on Hebrew letters, Jewish philosophy, what it means to carry words on the body and all the other things that keep us awake at night.</p>
      </div>
      <nav style="display:flex;flex-wrap:wrap;gap:10px 26px;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:clamp(48px,6vw,80px);">
        <sc-for list="{{ libraryGroups }}" as="g" hint-placeholder-count="5">

      <div style="display:flex;flex-direction:column;gap:clamp(56px,7vw,96px);">
        <sc-for list="{{ libraryGroups }}" as="g" hint-placeholder-count="4">
          <section id="lib-{{ g.key }}" style="scroll-margin-top:96px;display:grid;grid-template-columns:minmax(180px,240px) 1fr;gap:clamp(28px,4vw,64px);border-top:1px solid var(--line-strong);padding-top:clamp(26px,3vw,38px);">
            <div style="position:sticky;top:140px;align-self:start;">
              <h2 style="font-family:var(--font-display);font-weight:400;font-size:clamp(24px,2.4vw,32px);color:var(--ink-900);margin:0 0 12px;letter-spacing:-.01em;">{{ g.label }}</h2>

            </div>
            <div>
              <sc-for list="{{ g.items }}" as="e" hint-placeholder-count="3">
                <div style="display:grid;grid-template-columns:260px 1fr;gap:clamp(36px,4.2vw,56px);align-items:start;padding:44px 0;border-bottom:1px solid var(--line);">
                  <div onClick="{{ e.onClick }}" style="width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);cursor:pointer;transition:opacity var(--dur-base);" style-hover="opacity:0.85;">
                    <image-slot id="{{ e.slotId }}" shape="rect" src="{{ e.img }}" placeholder="Add image" style="display:block;width:100%;height:100%;"></image-slot>
                  </div>
                  <span onClick="{{ e.onClick }}" style="cursor:pointer;transition:opacity var(--dur-base);" style-hover="opacity:0.6;">
                    <h3 style="font-family:var(--font-display);font-weight:500;font-size:clamp(24px,2.3vw,30px);color:var(--ink-900);margin:0 0 10px;">{{ e.title }}</h3>
                    <p style="font-family:var(--font-serif);font-size:16.5px;line-height:1.65;color:var(--text-secondary);margin:0;max-width:62ch;">{{ e.excerpt }}</p>
                  </span>
                </div>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- ============ PRESS ============ -->
  <sc-if value="{{ isPress }}" hint-placeholder-val="{{ false }}">

        <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(38px,5vw,64px);color:var(--ink-900);margin:0;letter-spacing:-.015em;max-width:16ch;">Words that travelled beyond the skin</h1>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.65;color:var(--text-secondary);max-width:50ch;margin:0;">A selection of the print and broadcast features our work has appeared in, a small sample, not the whole shelf.</p>

        <p style="font-family:var(--font-display);font-weight:300;font-style:italic;font-size:clamp(22px,2.6vw,32px);line-height:1.35;color:var(--ink-900);max-width:26ch;margin:0;">For interviews, features and image requests, we’re glad to talk.</p>
        <button onClick="{{ goContact }}" style="background:#fff;border:1px solid #000;border-radius:0;padding:14px 30px;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#000;transition:opacity var(--dur-base);" style-hover="opacity:0.6;">Press enquiries</button>

  <!-- ============ ABOUT ============ -->
  <sc-if value="{{ isAbout }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="About" style="padding:clamp(48px,7vw,88px) clamp(1.5rem,5vw,5rem) clamp(72px,9vw,112px);">
    <div style="max-width:1100px;margin:0 auto;">

      <!-- Studio intro -->
      <!-- Hero -->
      <div style="display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(36px,5vw,80px);align-items:center;margin-bottom:clamp(64px,8vw,112px);">
        <div style="display:flex;flex-direction:column;align-items:flex-start;gap:24px;">
          <div style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);">THE HISTORY</div>
          <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(36px,4.6vw,60px);line-height:1.08;letter-spacing:-.015em;color:var(--ink-900);margin:0;">Hebrew Tattoos</h1>
          <p style="font-family:var(--font-display);font-weight:300;font-style:italic;font-size:clamp(22px,2.5vw,30px);line-height:1.36;color:var(--ink-900);margin:0;max-width:24ch;">The tradition of Hebrew lettering stretches back thousands of years.</p>
        </div>
        <div style="aspect-ratio:4/5;overflow:hidden;background:var(--paper-300);">
          <img src="/ds/Gabriel-at-work.jpg" alt="Gabriel Wolff at work" style="width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);">
        </div>
      </div>

      <!-- Narrative -->
      <article style="max-width:720px;margin:0 auto;">

        <p style="font-family:var(--font-display);font-weight:300;font-style:italic;font-size:clamp(32px,4.6vw,58px);line-height:1.2;letter-spacing:-.015em;color:var(--ink-900);margin:12px 0 16px;max-width:22ch;">I began drawing letters when I was five years old.</p>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">What I didn’t know then, was that the letters were in my blood.</p>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">For millennia, Jewish communities have entrusted their stories to letters. Torah scrolls copied by hand, books carried across borders, all of it passed from one generation to the next. While every culture has its sacred symbols, ours has always had a unique relationship with language. We became known as the People of the Book.</p>

        <figure style="margin:clamp(36px,4.5vw,52px) 0;">
          <div style="aspect-ratio:1/1;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-child-drawing" shape="rect" src="/assets/gabriel-child-drawing.jpg" placeholder="Gabriel Wolff as a young child, drawing" style="display:block;width:100%;height:100%;"></image-slot></div>
          <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">Writing, 1986</figcaption>
        </figure>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">Like many children in my community, I began learning to read and write at the age of three. But while others saw letters as tools for language, I saw something else. What I saw were shapes that contained movement and possibility, something I could play with.</p>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">Years later, I would describe letters as “little Lego pieces to do beautiful things with.” That fascination never left me.</p>

        <figure style="margin:clamp(36px,4.5vw,52px) 0;">
          <div style="aspect-ratio:3/2;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-jerusalem-wall" shape="rect" src="/assets/jerusalem-wall.png" placeholder="Hebrew lettering stencilled on a Jerusalem wall" style="display:block;width:100%;height:100%;"></image-slot></div>
          <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">A&nbsp;wall in Jerusalem.</figcaption>
        </figure>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">As a child and later a teenager, I filled anything I could find with letters: scraps of paper, pieces of wood, stones, walls, and the streets of Jerusalem [only occasionally being arrested for vandalism]. Long before I knew this would become my art and my calling, letters had already become my way of expressing myself.</p>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">At eighteen, I met a man named Igor, an overweight Russian Jew who would sometimes cry in his sleep. We shared a prison cell for a few months, and with little else to do, we talked for hours. Somewhere in those conversations, Igor became convinced that my future lay in bringing Hebrew calligraphy to skin. More importantly, he managed to convince me too.</p>
        <figure style="margin:clamp(36px,4.5vw,52px) 0;">
          <div style="aspect-ratio:4/5;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-bizzart" shape="rect" src="/assets/bizzart-jerusalem.jpg" placeholder="The Bizzart Studios sign in a Jerusalem alley" style="display:block;width:100%;height:100%;"></image-slot></div>
          <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">Bizzart Studios, Jerusalem.</figcaption>
        </figure>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">So when I was released a few months later, the first thing I did was knock on the door of Bizzart, one of&nbsp;the few tattoo studio in Israel, back in 2001. A guy named Poko welcomed me in, but it took only two weeks for me to find out that tattooing wasn’t my thing. Life moved on, but I didn't forget about the idea of skin being a very special canvas.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2.4vw,28px);margin:clamp(36px,4.5vw,52px) 0;">
          <figure style="margin:0;">
            <div style="aspect-ratio:1600/1063;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-banner-2008" shape="rect" src="/assets/hebrew-tattoos-banner-2008.jpg" placeholder="A hand-painted Hebrew Tattoos banner on wood" style="display:block;width:100%;height:100%;"></image-slot></div>
            <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">First attempts at a website banner, 2008. Not a digital guy...</figcaption>
          </figure>
          <figure style="margin:0;">
            <div style="aspect-ratio:1600/942;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-early-commission" shape="rect" src="/assets/rotterdam-early-commission.jpg" placeholder="An early hand-lettered commission" style="display:block;width:100%;height:100%;"></image-slot></div>
            <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">An early piece, 2010</figcaption>
          </figure>
        </div>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">So five years later, while living in Rotterdam, I created a website called Hebrew Tattoos. It was not a business plan or a career move. It was simply an art project born from my lifelong obsession with letters, and maybe an attempt to impress a girl I worked with.</p>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">I don’t think she ever noticed that website [or me, for that matter], but something else entirely unexpected happened: people began writing to me. They asked for artwork, and I would create each piece by hand, place it in an envelope, and mail it across the world.</p>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">What arrived with those requests was far more valuable than commissions. People brought me their stories. Stories of loss and love. Of family and faith. Of survival, grief, gratitude, identity, fear, resilience, and hope. Lots and lots of stories. Time and time again, people entrusted me with the most meaningful chapters of their lives.</p>

        <div style="clear:both;display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,4vw,56px);align-items:center;margin:clamp(28px,4vw,48px) 0;">
          <figure style="margin:0;">
            <div style="aspect-ratio:4/5;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-rotterdam-roof" shape="rect" src="/assets/rotterdam-roof-2008.jpg" placeholder="View over the Erasmusbrug from a Rotterdam rooftop" style="display:block;width:100%;height:100%;"></image-slot></div>
            <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">My rooftop in Rotterdam, 2008.</figcaption>
          </figure>
          <div>
            <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 20px;">One late afternoon in 2008, sitting on the roof of the squat I lived in, I realised something profound: the stories themselves had become my true inspiration. The artwork was simply a medium emerging from listening.</p>
            <p style="font-family: var(--font-display); font-weight: 300; font-style: italic; font-size: clamp(24px,2.9vw,38px); line-height: 1.24; letter-spacing: -.01em; color: var(--ink-900); margin: 0; position: relative">In that moment, Hebrew Tattoos was truly born.</p>
          </div>
        </div>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">At thirty, in 2013, I followed my inspiration to Buenos Aires, home to one of the largest Jewish communities in the world. There, I gathered a small team around a simple belief: that every person carries a story worth listening to, and that meaningful art begins with listening well.</p>
        <figure style="margin:clamp(36px,4.5vw,52px) 0;max-width:680px;">
          <div style="aspect-ratio:3/2;background:var(--paper-300);overflow:hidden;">
            <image-slot id="about-studio" shape="rect" src="/assets/buenos-aires-rooftop.jpg" placeholder="Add a studio or city image" style="display:block;width:100%;height:100%;"></image-slot>
          </div>
          <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">My rooftop view in Buenos Aires</figcaption>
        </figure>
        <p style="clear:both;font-family:var(--font-display);font-weight:300;font-style:italic;font-size:clamp(32px,4.6vw,58px);line-height:1.2;letter-spacing:-.015em;color:var(--ink-900);margin:clamp(32px,4.5vw,56px) 0;max-width:24ch;">Today, that work is carried forward by a small team united by the same philosophy.</p><p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">Since then, the essence of the work has remained unchanged. Today, I live in Berlin, where my team and I work with a small number of clients at a time. Together, we spend countless hours exploring memories, questions, struggles, beliefs, family histories, and dreams. We study texts, search for symbols, and look for the Hebrew words that can carry a person’s story with honesty and precision.</p>
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">Out of those conversations emerge Hebrew words, and out of those words emerge artworks that become part of a person’s life story.</p>

        

      </article>

      <div style="max-width:920px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(28px,3vw,44px);">
        <figure onClick="{{ openMaya }}" style="margin:0;cursor:pointer;" style-hover="opacity:0.82;">

          </div>
          <figcaption>
            <span style="display:block;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--ink-900);">Maya</span>
            <span style="display:block;font-family:var(--font-sans);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);margin-top:5px;">View profile →</span>
            <span style="display:block;font-family:var(--font-serif);font-size:15px;line-height:1.6;color:var(--text-secondary);margin-top:12px;">Guides each client along the journey, from the first message to the finished piece.</span>

        <figure onClick="{{ openAnna }}" style="margin:0;cursor:pointer;" style-hover="opacity:0.82;">

          </div>
          <figcaption>
            <span style="display:block;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--ink-900);">Anna</span>
            <span style="display:block;font-family:var(--font-sans);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);margin-top:5px;">View profile →</span>
            <span style="display:block;font-family:var(--font-serif);font-size:15px;line-height:1.6;color:var(--text-secondary);margin-top:12px;">Dives deep into the storytelling of each project, uncovering the words that can carry it with honesty.</span>

        <figure onClick="{{ openDaniel }}" style="margin:0;cursor:pointer;" style-hover="opacity:0.82;">

            <img src="https://images.squarespace-cdn.com/content/v1/66f3b7bb5e17866c784e02e7/4c05731a-55f7-4ed0-9059-532257f7bf59/Daniel_BW.png?format=500w" alt="Daniel Sgan-Cohen" style="width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);">
          </div>
          <figcaption>
            <span style="display:block;font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--ink-900);">Daniel</span>
            <span style="display:block;font-family:var(--font-sans);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);margin-top:5px;">View profile →</span>
            <span style="display:block;font-family:var(--font-serif);font-size:15px;line-height:1.6;color:var(--text-secondary);margin-top:12px;">Crafts models, proportional to each person, so each artwork can be shaped for the body that will carry it.</span>

      <article style="max-width:680px;margin:clamp(48px,6vw,72px) auto 0;">
        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-primary);margin:0;">This is the way we continue the same work that began decades ago with a child staring at the shapes of Hebrew letters and imagining what they might become. The letters never stopped being little Lego pieces. The difference is that today they carry stories, memories, and meanings that people choose to take with them for the rest of their lives.</p>

        <div style="text-align:center;margin-top:clamp(34px,4.5vw,56px);">

  <!-- ============ MA'ASER ============ -->
  <sc-if value="{{ isMaaser }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Ma'aser" style="padding:clamp(48px,7vw,88px) clamp(1.5rem,5vw,5rem) clamp(72px,9vw,112px);">
    <div style="max-width:720px;margin:0 auto;">
      <article>
        <div style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);margin-bottom:18px;">The Studio</div>
        <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(36px,4.6vw,58px);line-height:1.1;letter-spacing:-.015em;color:var(--ink-900);margin:0 0 clamp(32px,4vw,48px);max-width:16ch;">Why We Give Ma’aser</h1>

        <figure style="margin:0 0 clamp(40px,5vw,56px);">
          <div style="aspect-ratio:4/5;background:var(--paper-300);overflow:hidden;"><image-slot id="hist-tzedakah" shape="rect" src="/assets/tzedakah-box.jpg" placeholder="A traditional silver tzedakah box inscribed with 'Tzedakah t" style="display:block;width:100%;height:100%;"></image-slot></div>
          <figcaption style="font-family:var(--font-serif);font-style:italic;font-size:13.5px;line-height:1.4;color:var(--text-muted);margin-top:10px;">A tzedakah box, quietly present.</figcaption>
        </figure>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">Growing up in Jerusalem, I remember seeing matan ba’seter boxes everywhere. Quiet little charity boxes in shops, synagogues, schools, and private homes. Nobody made a show of putting money in them. Nobody applauded. They were simply there, a reminder that giving is meant to be woven into ordinary life.</p>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">That is still how I understand ma’aser, the Jewish practice of setting aside part of one’s income for tzedakah. It is often described as giving ten percent, but the halachic reality is more nuanced, especially in a country like Germany, where businesses already pay significant taxes that support healthcare, education, welfare, and public infrastructure.</p>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">For that reason, we do give ma’aser, but not as a simple ten percent. We try to calculate it responsibly, based on net income after taxes and legitimate business expenses, while remaining faithful to both the halachic discussion and the spirit behind it.</p>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0 0 24px;">We do not see this as something exceptional. It is simply part of the responsibility that comes with making a living. Judaism teaches that success is never entirely ours alone. Whatever we have is entrusted to us, and part of that trust is making sure others benefit from it as well.</p>

        <p style="font-family:var(--font-display);font-weight:300;font-style:italic;font-size:clamp(24px,2.8vw,34px);line-height:1.32;color:var(--ink-900);margin:clamp(24px,3.5vw,44px) 0;">Like many things in Jewish life, ma’aser is not only about a number. It is about cultivating a habit of gratitude, responsibility, and quiet justice.</p>

        <p style="font-family:var(--font-serif);font-size:19px;line-height:1.78;color:var(--text-secondary);margin:0;">If you own a business and have been thinking about giving ma’aser yourself, feel free to reach out. We’d be happy to share the approach that has worked for us.</p>

        <div style="margin-top:clamp(40px,5vw,60px);border-top:1px solid var(--line);padding-top:34px;">
          <button onClick="{{ goContact }}" style="background:#fff;border:1px solid #000;border-radius:0;padding:14px 30px;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#000;transition:opacity var(--dur-base);" style-hover="opacity:0.6;">Get in touch</button>
        </div>
      </article>
    </div>
  </div>
  </sc-if></main>

  <!-- ============ WHY HEBREW LETTERS ============ -->
  <sc-if value="{{ isWhyLetters }}" hint-placeholder-val="{{ false }}">
  <div data-screen-label="Why Hebrew Letters" style="padding:clamp(48px,7vw,88px) clamp(1.5rem,5vw,5rem) clamp(72px,9vw,112px);">
    <div style="max-width:680px;margin:0 auto;">
      <div style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);">The Letters</div>
      <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(34px,4.4vw,52px);color:var(--ink-900);margin:14px 0 16px;letter-spacing:-.015em;">Why Hebrew letters</h1>
      <p style="font-family:var(--font-serif);font-size:17px;line-height:1.7;color:var(--text-secondary);margin:0 0 44px;">Not a font, not an alphabet borrowed for effect, a living script, drawn by hand, carrying more than the words it spells.</p>

      <div style="display:flex;flex-direction:column;gap:32px;font-family:var(--font-serif);font-size:16.5px;line-height:1.75;color:var(--text-secondary);">
        <div>
          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">A letter is a form</h2>
          <p style="margin:0;">Every Hebrew letter has its own architecture, the weight of a stroke, the breath of white space around it, the way it sits beside its neighbours. Drawn well, a single word becomes a composition. That is why each piece begins not with a typeface but with a pen: the letters are designed, not selected.</p>
        </div>
        <div>
          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">Meaning held in shape</h2>
          <p style="margin:0;">These are the letters of prayer and memory, of names given and names remembered. They have been carried for thousands of years, through exile and return. To wear them is to wear a thread of that continuity, and to ask that it be rendered with the care the words deserve.</p>
        </div>
        <div>
          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">Why letters, and not an image</h2>
          <p style="margin:0;">An image shows. A letter says. A verse on the skin can be read, spoken, returned to. It holds a sentence you chose, in a hand made for you alone. The work of this studio is to make that sentence beautiful, legible, and unmistakably yours.</p>
        </div>
        <div>
          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">Made once, for one person</h2>
          <p style="margin:0;">No design leaves the studio twice. Your words, your placement, your story shape the letterform from the first sketch. What you carry is a single original, drawn for your body and no other.</p>
        </div>
        <div style="border-top:1px solid var(--line);padding-top:36px;margin-top:8px;">
          <button onClick="{{ goContact }}" style="background:#fff;border:1px solid #000;border-radius:0;padding:14px 30px;cursor:pointer;font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#000;transition:opacity var(--dur-base);" style-hover="opacity:0.6;">Begin a commission →</button>
        </div>
      </div>
    </div>
  </div>
  </sc-if>

      <div style="font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--text-muted);">Legal</div>
      <h1 style="font-family:var(--font-display);font-weight:300;font-size:clamp(34px,4.4vw,52px);color:var(--ink-900);margin:14px 0 16px;letter-spacing:-.015em;">Privacy Policy</h1>
      <p style="font-family:var(--font-serif);font-size:17px;line-height:1.7;color:var(--text-secondary);margin:0 0 44px;">A word on how we hold what you entrust to us. Discretion is not an afterthought here. It is part of the craft.</p>

      <div style="display:flex;flex-direction:column;gap:32px;font-family:var(--font-serif);font-size:16.5px;line-height:1.75;color:var(--text-secondary);">

        </div>
        <div>
          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">Cookies</h2>

        <div>

        </div>
        <div>
          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">Children</h2>
          <p style="margin:0;">We do not knowingly collect information from anyone under the age of thirteen, or older where local law requires. Should a parent discover otherwise, we ask only to be told.</p>

          <h2 style="font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--ink-900);margin:0 0 10px;">Should this change</h2>
          <p style="margin:0;">This policy may be revised from time to time. Where the change is meaningful, we will say so.</p>

          <p style="margin:0;">For any question concerning this policy, or to exercise the rights described above, write to us directly.<br><br>Email: <a href="mailto:studio@hebrew-tattoos.com" style="color:var(--ink-900);text-decoration:underline;">studio@hebrew-tattoos.com</a><br>Telephone: +49 160 6641528<br>Address: Seelenbinderstrasse 141, 12555 Berlin, Germany</p>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  journeyRailRef = React.createRef();
  mailAnchorRef = React.createRef();
  updateJourneySaturation = () => {
    const rail = this.journeyRailRef.current;
    if (!rail) return;
    const cards = Array.from(rail.querySelectorAll('[data-journey-card]'));
    if (!cards.length) return;
    // NOTE: cards are position:sticky — offsetLeft reflects their current
    // stuck position, not their original flow slot, so it can't be used to
    // find each card's arrival point. Compute the uniform step analytically
    // instead (card width + flex gap) and derive each card's position from
    // its index.
    const gap = parseFloat(getComputedStyle(rail).columnGap) || 0;
    const step = cards[0].getBoundingClientRect().width + gap;
    if (!step) return;
    const activePos = rail.scrollLeft / step;
    cards.forEach((card, i) => {
      const img = card.querySelector('image-slot');
      const delta = i - activePos;
      if (img) {
        const g = delta <= 0 ? 0 : Math.min(0.85, delta * 0.45);
        img.style.transition = 'none';
        img.style.filter = 'grayscale(' + g + ')';
      }
      const wrap = card.querySelector('[data-journey-text-wrap]');
      const text = card.querySelector('[data-journey-text]');
      if (wrap && text) {
        // Body copy is collapsed to 0 height (clipped) while the card is
        // still sliding in. As it lands, the wrapper grows to its natural
        // height — scroll-linked, no easing lag — which pushes the title
        // upward above it, rather than the copy simply fading/sliding over.
        if (wrap._naturalH == null) wrap._naturalH = text.scrollHeight;
        const revealed = delta <= 0 ? 1 : Math.max(0, 1 - delta * 2);
        wrap.style.transition = 'none';
        wrap.style.height = (wrap._naturalH * revealed).toFixed(1) + 'px';
      }
    });
  };
  sizeJourneySpacer = () => {
    const rail = this.journeyRailRef.current;
    if (!rail) return;
    const cards = rail.querySelectorAll('[data-journey-card]');
    const cta = rail.querySelector('[data-journey-cta]');
    const spacer = rail.querySelector('[data-journey-spacer]');
    if (!cards.length || !spacer) return;
    const cardW = cards[0].getBoundingClientRect().width;
    const gap = parseFloat(getComputedStyle(rail).columnGap) || 0;
    const n = cards.length;
    // Static (non-sticky) left edge of the last card, computed analytically
    // since offsetLeft is unreliable once a sticky element is stuck.
    const lastCardStaticX = (n - 1) * (cardW + gap);
    // We want max scroll to land exactly at lastCardStaticX (so the last
    // photo card is flush) — no further, or the trailing CTA card (which
    // is NOT sticky and must never get dragged onto the stack) would be
    // pulled past its natural resting spot beside the stack.
    let contentEndX = lastCardStaticX + cardW;
    if (cta) contentEndX += gap + cta.getBoundingClientRect().width;
    const railW = rail.clientWidth;
    const neededTotalWidth = lastCardStaticX + railW;
    spacer.style.flexBasis = Math.max(0, neededTotalWidth - contentEndX) + 'px';
  };
  journeyScrollHandler = () => this.updateJourneySaturation();
  journeyResizeHandler = () => this.sizeJourneySpacer();
  attachJourneyRail = (el) => {
    if (this._journeyRailEl === el) return;
    if (this._journeyRailEl) {
      this._journeyRailEl.removeEventListener('scroll', this.journeyScrollHandler);
      window.removeEventListener('resize', this.journeyResizeHandler);
    }
    this._journeyRailEl = el;
    this.journeyRailRef.current = el;
    if (el) {
      el.addEventListener('scroll', this.journeyScrollHandler, { passive: true });
      window.addEventListener('resize', this.journeyResizeHandler);
      setTimeout(() => { this.sizeJourneySpacer(); this.updateJourneySaturation(); }, 150);
    }
  };
  state = {
    cookieChoiceMade: false,
    route: 'home',
    filter: 'All work',
    step: 0,
    tlActive: 0,
    journeyPct: 0,
    data: { phrase: '', meaning: '', script: 'Ashurit', place: 'Forearm', name: '', email: '' },
    contact: { name: '', email: '', phone: '', message: '' },
    contactSent: false,
    lastMailto: '', lastMailBody: '', copyDone: false, sending: false, sentVia: '',
    openFaq: -1,
    store: null,
    activeWork: null, activePost: null, activeMember: null, activeTattooist: null,
    subEmail: '', subDone: false,
    openMenu: null, libExpanded: null,
    mobileSection: null,
    coverSlider: 50,
  };

  setCoverSlider = (e) => this.setState({ coverSlider: Number(e.target.value) });

  toTop = () => {
    const jump = () => { try { window.scrollTo(0, 0); } catch (e) {} try { document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch (e) {} };
    jump();
    requestAnimationFrame(jump);
    [0, 40, 120, 260].forEach((d) => setTimeout(jump, d));
  };

  VALID_ROUTES = ['home','work','commission','contact','tryout','newsletter','team','faq','blog','press','piece','post','member','shop','testimonies','materials','care','tattooists','tattooist','maaser','studiovisit','innercircle','placement','guides','impressum','privacy','whyletters','about','sitemap','selected'];

  ROUTE_TO_PATH = { home: '/', work: '/tattoos', commission: '/commission', contact: '/contact', tryout: '/tryout', newsletter: '/newsletter', team: '/the-team', faq: '/faq', blog: '/blog', press: '/press', shop: '/shop', testimonies: '/testimonies', materials: '/materials', care: '/aftercare', tattooists: '/tattooists', maaser: '/maaser', studiovisit: '/studio-visit', innercircle: '/inner-circle', placement: '/placement', guides: '/guides', impressum: '/impressum', privacy: '/privacy', whyletters: '/why-letters', about: '/about', sitemap: '/sitemap', selected: '/selected' };

  urlFor = (route, slug) => {
    if (route === 'piece') return '/' + slug;
    if (route === 'post') return '/blog/' + slug;
    if (route === 'member') return '/the-team/' + slug;
    if (route === 'tattooist') return '/tattooists/' + slug;
    return this.ROUTE_TO_PATH[route] || '/';
  };

  pushUrl = (route, slug) => {
    try { const u = this.urlFor(route, slug); if (window.location.pathname !== u) window.history.pushState(null, '', u); } catch (e) {}
  };

  parsePath = (pathname) => {
    let p = (pathname || '/').replace(/\/+$/, '') || '/';
    const byPath = {}; Object.keys(this.ROUTE_TO_PATH).forEach((k) => { byPath[this.ROUTE_TO_PATH[k]] = k; });
    if (byPath[p]) return { route: byPath[p] };
    const seg = p.split('/').filter(Boolean);
    if (seg[0] === 'blog' && seg[1]) return { route: 'post', activePost: decodeURIComponent(seg[1]) };
    if (seg[0] === 'the-team' && seg[1]) return { route: 'member', activeMember: decodeURIComponent(seg[1]) };
    if (seg[0] === 'tattooists' && seg[1]) return { route: 'tattooist', activeTattooist: decodeURIComponent(seg[1]) };
    if (seg.length === 1) return { route: 'piece', activeWork: decodeURIComponent(seg[0]) };
    return null;
  };

  // Route changes must kick the reveal pipeline themselves (componentDidUpdate
  // is unreliable in this runtime): tag the freshly mounted screen while its
  // blocks are still un-revealed, then reveal a beat later so the page-entry
  // animation actually plays for above-fold content.
  kickReveals = () => {
    [60, 250, 600].forEach((d) => setTimeout(() => {
      this.tagReveals();
      // Reveal on the NEXT frame — adding .lx-r and .lx-in in the same style
      // pass would skip the transition entirely.
      requestAnimationFrame(() => requestAnimationFrame(() => this.revealMicro()));
    }, d));
  };

  ORIGIN = 'https://www.hebrew-tattoos.com';

  META = {
    home: ['Hebrew Tattoos — Original Hebrew and Jewish tattoo art by Gabriel Wolff', 'We draw Hebrew and Jewish tattoo art for people all over the world. Every piece is an original, drawn by hand for one person, from the studio in Berlin.'],
    work: ['Tattoos — Hebrew Tattoos', 'A portfolio of original Hebrew lettering pieces, each drawn by hand for the person who carries it.'],
    commission: ['Commission a piece — Hebrew Tattoos', 'How to commission an original Hebrew tattoo: the conversation, the concept, the drawing and the tattoo itself.'],
    contact: ['Contact — Hebrew Tattoos', 'Write to the studio about a commission, a question, or a visit to Berlin.'],
    tryout: ['Try it on — Hebrew Tattoos', 'See how Hebrew lettering sits on the body before you commit to a piece.'],
    newsletter: ['Newsletter — Hebrew Tattoos', 'New pieces, essays and word of where we are exhibiting next. Roughly twice a month.'],
    team: ['The team — Hebrew Tattoos', 'The people behind the studio: Gabriel, Maya, Anna and Daniel.'],
    faq: ['Questions, answered — Hebrew Tattoos', 'Common questions about commissioning, pricing, placement, healing and the Jewish tradition around tattoos.'],
    blog: ['Library — Hebrew Tattoos', 'Essays on Hebrew letters, Jewish thought, and what it means to carry words on the body.'],
    press: ['Press — Hebrew Tattoos', 'Where the studio and its work have been written about and exhibited.'],
    shop: ['Shop — Hebrew Tattoos', 'Prints and editions from the studio.'],
    testimonies: ['Testimonies — Hebrew Tattoos', 'In their own words: people who carry a piece drawn in this studio.'],
    materials: ['Materials — Hebrew Tattoos', 'The inks, nibs, brushes, papers and pigments the work is made with.'],
    care: ['Tattoo and aftercare — Hebrew Tattoos', 'How the tattoo session runs, and how to care for the piece while it heals.'],
    tattooists: ['Tattooists — Hebrew Tattoos', 'The tattoo artists around the world who ink pieces drawn in this studio.'],
    maaser: ['Ma\u2019aser — Hebrew Tattoos', 'A tenth of what the studio earns goes back out. What that means in practice.'],
    studiovisit: ['A studio visit — Hebrew Tattoos', 'Visiting the studio in Berlin: what a session looks like, and where to stay.'],
    innercircle: ['Inner circle — Hebrew Tattoos', 'The closer circle around the studio.'],
    placement: ['Placement — Hebrew Tattoos', 'Where a word belongs on the body, and why each placement carries its own character.'],
    guides: ['The process — Hebrew Tattoos', 'Every step from the first conversation to the finished tattoo.'],
    impressum: ['Impressum — Hebrew Tattoos', 'Legal notice and contact details for Hebrew Tattoos, Berlin.'],
    privacy: ['Privacy policy — Hebrew Tattoos', 'How this site handles your data.'],
    whyletters: ['Why Hebrew letters — Hebrew Tattoos', 'On the Hebrew alphabet, and why these letters carry what they carry.'],
    about: ['About — Hebrew Tattoos', 'The studio, the work, and how it came to be.'],
    sitemap: ['Sitemap — Hebrew Tattoos', 'Every page on this site.'],
    selected: ['Selected pieces — Hebrew Tattoos', 'Six commissions, each one drawn once and worn by one person.'],
    notfound: ['Page not found — Hebrew Tattoos', 'That page does not exist. It may have moved, or the link may be out of date.'],
  };

  setTag = (sel, attr, val) => {
    try {
      let el = document.head.querySelector(sel);
      if (!el) {
        el = document.createElement(sel.indexOf('link') === 0 ? 'link' : 'meta');
        const m = sel.match(/\[(?:property|name|rel)="([^"]+)"\]/);
        if (m) el.setAttribute(sel.indexOf('link') === 0 ? 'rel' : (sel.indexOf('property') > -1 ? 'property' : 'name'), m[1]);
        document.head.appendChild(el);
      }
      el.setAttribute(attr, val);
    } catch (e) {}
  };

  syncMeta = (route, slug) => {
    try {
      const pair = this.META[route] || this.META.home;
      let title = pair[0], desc = pair[1];
      if (slug) {
        const pretty = String(slug).replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
        title = pretty + ' — Hebrew Tattoos';
      }
      const url = this.ORIGIN + this.urlFor(route, slug);
      document.title = title;
      this.setTag('meta[name="description"]', 'content', desc);
      this.setTag('link[rel="canonical"]', 'href', url);
      this.setTag('meta[property="og:title"]', 'content', title);
      this.setTag('meta[property="og:description"]', 'content', desc);
      this.setTag('meta[property="og:url"]', 'content', url);
      this.setTag('meta[name="twitter:title"]', 'content', title);
      this.setTag('meta[name="twitter:description"]', 'content', desc);
      // A mistyped URL is a real 404 (see _redirects' SPA fallback), but the
      // body still renders this same document — tell crawlers not to index
      // the mistyped address itself, distinct from the actual 404 status.
      this.setTag('meta[name="robots"]', 'content', route === 'notfound' ? 'noindex' : 'index, follow');
    } catch (e) {}
