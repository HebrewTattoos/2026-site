<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a time with Daniel — Hebrew Tattoos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/ds/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
  html, body { margin: 0; background: var(--color-bg, #fff); }
  * { box-sizing: border-box; }
  .dp-header {
    display: flex; align-items: center; padding: 20px clamp(1.2rem, 5vw, 2rem);
    border-bottom: 1px solid var(--line, #cbd1e0);
  }
  .dp-header a { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .dp-header img { height: 32px; width: auto; display: block; }
  .dp-header span {
    font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--accent, #2338c9);
  }
  .dp-main {
    max-width: 640px; margin: 0 auto; padding: clamp(48px, 8vw, 88px) clamp(1.2rem, 5vw, 2rem) 96px;
  }
  .dp-eyebrow {
    font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase; color: var(--text-muted, #6b7187);
    margin: 0 0 16px;
  }
  .dp-h1 {
    font-family: var(--font-display, serif); font-weight: 300; font-size: clamp(30px, 4vw, 40px);
    line-height: 1.15; letter-spacing: -.01em; margin: 0 0 14px; color: var(--ink-900, #13141e);
  }
  .dp-sub {
    font-family: var(--font-serif, serif); font-size: 17px; line-height: 1.6;
    color: var(--text-secondary, #454a60); margin: 0 0 40px; max-width: 52ch;
  }
  .dp-frame {
    border: 1px solid var(--line, #cbd1e0); border-radius: var(--radius-sm, 0); overflow: hidden;
  }
  .dp-frame iframe { display: block; width: 100%; height: 700px; border: none; }
</style>
</head>
<body>
  <header class="dp-header">
    <a href="/">
      <img src="/assets/logo-2026.png" alt="Hebrew Tattoos">
      <span>Hebrew Tattoos</span>
    </a>
  </header>
  <main class="dp-main">
    <p class="dp-eyebrow">Book a time</p>
    <h1 class="dp-h1">Daniel's calendar</h1>
    <p class="dp-sub">Pick a time that works for you, and Daniel will confirm shortly after.</p>
    <div class="dp-frame">
      <iframe src="https://meetings-eu1.hubspot.com/daniel-sgan-cohen?embed=true" title="Book a meeting with Daniel"></iframe>
    </div>
  </main>
</body>
</html>
